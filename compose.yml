services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./ludia:/app/ludia
      - ./uploads:/app/uploads
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:postgres@db/postgres
      - ALLOWED_HOSTS=*
    env_file:
      - .env
    depends_on:
      - db
    command: "./start.sh dev"

  assets:
    build:
      context: .
      target: assetsbuild
    volumes:
      - ./ludia:/app/ludia/
    tty: true

volumes:
  postgres_data:
